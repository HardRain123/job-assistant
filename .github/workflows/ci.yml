name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build web application
        run: pnpm build

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable build secrets
        run: sh deploy/init-secrets.sh
      - name: Build required service images
        run: docker compose build app worker
      - name: Build optional bridge image
        run: docker compose --profile chatgpt build bridge
